# Publish downloads (#355). Adopted from the handbook's templates/publish-downloads.yml (handbook c1fee766);
# this repository owns this copy. Its script is .github/downloads/publish-downloads.mjs (copied verbatim).
#
# ONE DEVIATION FROM THE TEMPLATE, on purpose: WHERE THE FILES COME FROM. The template downloads them from the tag's
# GitHub Release. This repository makes no Release (release-auto.yml: npx is the one install surface), and a final's
# binaries exist only as the workflow artifact `muster-binaries-<tag>` that release-npm.yml uploads in the run that
# publishes it. So the download step below reads THAT artifact, with `gh run download`, from the run named by the
# `run_id` input — the calling run when chained (github.run_id), a run you name when dispatched by hand. Everything
# after that step is the template unchanged.
#
# DORMANT until the repo variable DOWNLOADS_URL is set: the chaining jobs in release-auto.yml are skipped without it,
# so a repo that has not set a site up is never red. A manual dispatch without it fails saying so.
#
# A RETRY past the artifact's 7 days is not possible from here (the files are gone): re-run the failed job in its
# original run while the artifact lives, or publish the tag again through release-auto.yml's publish-tag dispatch,
# which builds it again.
#
# For: a repo whose FINAL releases carry files people install on their own machines (a .dmg, a .deb, an
# .msi, a tarball …), published to a self-hosted downloads site — one folder per app, the newest finals kept
# by the site (colab-handbook #648; docs/downloads.md has the whole contract). What is published comes from
# the repo's `.github/project.yml` `downloads:` block plus a manifest.json the site's portal lists the app
# from; the script's header documents both.
#
# WHAT IT DOES for a final tag vX.Y.Z whose binaries are in the run's artifact: uploads them with rsync over SSH
# in the order that keeps a half-finished run harmless — the version folder (with a combined SHA256SUMS last
# inside it, written only after every file read back over HTTPS against it), then the installers with the
# site address stamped in, then manifest.json, then latest.json LAST — and reads it all back. A published
# version is immutable: nothing is ever replaced, and a build whose SHA256SUMS differs from the published
# one is refused. A re-run of a complete version verifies and sends nothing. NEVER a candidate (-rc.N).
#
# WHEN IT RUNS.
#   - Chained: release-auto.yml calls this one as the LAST job of each final's path — `downloads-final` after
#     `publish-final`, `downloads-existing` after `publish-existing` (the path a human-cut final takes) — and only
#     when the npm publish of that tag succeeded and vars.DOWNLOADS_URL is set. A tag pushed with GITHUB_TOKEN
#     starts no other workflow, so a chained call is the reliable trigger.
#   - By hand (Actions → Run workflow) with a tag and the run id of the run that built it: retries a failed
#     publish, finishes a partial one (only the missing files are sent), re-checks a complete one. `dry_run`
#     stages and lists — it uploads nothing.
#   The project.yml, manifest, installers and script are read from THIS run's checkout: the branch the run was
#   started from (main for a chained call), not the tag.
#
# THE RUNNER. The read-back goes over HTTPS to the site, which may be reachable only on a private network —
# a GitHub-hosted runner then cannot read anything back. `runs-on` is an input: a bare label or a JSON label
# list of a runner that can reach the site. If the site's name does not resolve there, the run fails saying
# so, before anything is sent. The runner needs `gh`, `rsync` and `ssh`; Node is set up by the job.
#
# CONFIGURATION — per repo, never shared between repos:
#   secrets   DOWNLOADS_SSH_KEY · DOWNLOADS_SSH_HOST · DOWNLOADS_SSH_PORT · DOWNLOADS_SSH_USER ·
#             DOWNLOADS_SSH_KNOWN_HOSTS — an upload account restricted to this app's folder, that cannot delete.
#             The older name DOWNLOADS_KNOWN_HOSTS is still read when DOWNLOADS_SSH_KNOWN_HOSTS is unset, so a
#             repo set up before the rename keeps publishing; rename the secret when convenient.
#   variable  DOWNLOADS_URL — the site's root address (https). The script appends /<app>; no host is ever
#             written in the repository.
#
# THIS FILE DOES NOT CHANGE YOUR REPO'S EXPOSURE (OR LEGACY TIER): it publishes files a final already made.
name: Publish downloads

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
      run_id:
        type: string
        default: '' # the run that holds the muster-binaries-<tag> artifact; empty = the calling run
      runs-on:
        type: string
        default: '["self-hosted","linux"]' # a runner that can reach the downloads site
      reserved:
        type: string
        default: '' # names the site keeps for itself, refused as an app slug (space-separated); empty: none
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing FINAL tag to publish, e.g. v1.4.0 (a candidate is refused)'
        type: string
        required: true
      dry_run:
        description: 'Dry run: stage and list what would be sent — nothing is uploaded'
        type: boolean
        default: false
      run_id:
        description: 'Run id that holds the muster-binaries-<tag> artifact (the Release (auto) run that published the tag; its artifact lives 7 days)'
        type: string
        required: true
      runs-on:
        description: 'Runner: a bare label or a JSON label list of a runner that can reach the site'
        type: string
        default: '["self-hosted","linux"]' # keep in step with the workflow_call default
      reserved:
        description: 'Names the site reserves for itself, refused as an app slug (space-separated)'
        type: string
        default: '' # keep in step with the workflow_call default

permissions: {}

concurrency:
  group: publish-downloads-${{ inputs.tag }}
  cancel-in-progress: false

env:
  PUBLISH_SCRIPT: .github/downloads/publish-downloads.mjs

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 45 # five binaries of a few MB each; this is slack for a slow link
    permissions:
      contents: read
      actions: read # gh run download: the artifact of the run that built the binaries
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.run_id || github.run_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      DOWNLOADS_URL: ${{ vars.DOWNLOADS_URL }}
      DOWNLOADS_RESERVED: ${{ inputs.reserved }}
      DOWNLOADS_SSH_HOST: ${{ secrets.DOWNLOADS_SSH_HOST }}
      DOWNLOADS_SSH_PORT: ${{ secrets.DOWNLOADS_SSH_PORT }}
      DOWNLOADS_SSH_USER: ${{ secrets.DOWNLOADS_SSH_USER }}
    steps:
      - name: A final tag only
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a final tag (vX.Y.Z): only finals are published"; exit 1; }

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22' # any Node >= 18 runs the script

      - name: The tools the run needs
        run: |
          set -euo pipefail
          need="gh"; [ "$DRY_RUN" = "true" ] || need="gh rsync ssh"
          for t in $need; do command -v "$t" >/dev/null || { echo "::error::$t is not on this runner — pick one that has it (the runs-on input)"; exit 1; }; done
          node "$PUBLISH_SCRIPT" check

      - name: Download the built binaries (the run's artifact, not a Release)
        id: assets
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/assets"; rm -rf "$DIR" "$RUNNER_TEMP/artifact"; mkdir -p "$DIR"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "muster-binaries-$TAG" --dir "$RUNNER_TEMP/artifact"
          # Only what downloads.files / downloads.optional name goes on: the artifact also holds the Windows
          # builds (not published) and the build's own SHA256SUMS (the script computes the site's).
          while IFS= read -r name; do
            if [ -f "$RUNNER_TEMP/artifact/$name" ]; then cp "$RUNNER_TEMP/artifact/$name" "$DIR/$name"; fi
          done < <(node "$PUBLISH_SCRIPT" names "$TAG")
          ls -l "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Write the upload key (this run only)
        if: inputs.dry_run != true
        env:
          KEY: ${{ secrets.DOWNLOADS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DOWNLOADS_SSH_KNOWN_HOSTS || secrets.DOWNLOADS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$KEY" ] && [ -n "$KNOWN_HOSTS" ] || { echo "::error::the downloads upload secrets are not set on this repo"; exit 1; }
          mkdir -p "$RUNNER_TEMP/downloads-ssh"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/downloads-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/downloads-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/downloads-ssh/key" "$RUNNER_TEMP/downloads-ssh/known_hosts"

      - name: Publish
        env:
          ASSETS: ${{ steps.assets.outputs.dir }}
          DOWNLOADS_KEY_FILE: ${{ runner.temp }}/downloads-ssh/key
          DOWNLOADS_KNOWN_HOSTS_FILE: ${{ runner.temp }}/downloads-ssh/known_hosts
        run: |
          set -euo pipefail
          FLAG=""; [ "$DRY_RUN" = "true" ] && FLAG="--dry-run"
          # The script's own status is kept: a `{ …; echo; } | tee` group would end on the echo and go green.
          status=0
          { echo "### Downloads → $TAG"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node "$PUBLISH_SCRIPT" publish "$TAG" "$ASSETS" $FLAG 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Remove the upload key
        if: always()
        run: rm -rf "$RUNNER_TEMP/downloads-ssh"
