name: CI

# Triggers: a push to trunk, a push to a session branch, and pull requests.
#
# A session-branch push IS a trigger (#299). It reverses the first ruling of
# #199, which kept trunk and pull requests only. That ruling had three
# concerns, and each is answered:
#   - exposure: a branch push has already published the branch; a trigger adds
#     none. The gitleaks step scopes a branch push as origin/<trunk>..HEAD.
#   - a misleading class: a scan-only run reading `green` with no test behind
#     it. It cannot happen, because the WHOLE workflow runs on a branch, so the
#     `go` job (scripts/gate.sh, -race) runs too and `green` means tests ran.
#   - flakes: a -race flake on a branch now blocks that branch's ship. That is
#     the accepted cost of `gate.authoritative: ci` in project.yml: the full
#     suite runs here, on a hosted runner, and never on a developer machine.
# The globs are the branch types in CLAUDE.md plus `design/`.
#
# The `dedupe` job (#463, the handbook's CI template) is the one gate every job
# below hangs off: a push to `main` whose tree a branch run already passed skips
# the suite and cites that run in a `tree-already-green` notice, and a branch's
# first push at a sha that already has a green run does the same. `dedupe` itself
# concludes `success`, so the run reads green and release-auto.yml's `workflow_run`
# trigger on a CI success still fires. A pull request from a fork still runs the
# suite; a pull request from this repository skips, because its push run is the one
# that tests. Jobs that must run on `main` (release, publish) are separate
# workflows and are not behind this gate.
#
# Reasoning, and the convention for key-shaped test fixtures:
# docs/internals.md, "Secret scanning, and fixtures that look like secrets".
on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "refactor/**"
      - "test/**"
      - "perf/**"
      - "design/**"
  pull_request:

jobs:
  # Already tested? This job is the one that concludes `success` when the suite is skipped: a
  # run whose jobs ALL skip concludes `skipped`, which `colab ship` reads as not-green.
  #   - At this SHA (#418): on a ref's first push (a claim push), a green non-PR run of this
  #     workflow at the same sha means the suite already ran.
  #   - At this TREE (#493): on a push to trunk, a green push run elsewhere whose commit has the
  #     byte-identical tree (a squash of a branch that already contained its base) is reused and
  #     cited in a `tree-already-green` notice. `tree-reuse: off` in .github/project.yml opts out.
  #     A run that skipped a job (a trunk-only job skips on branches) is never reused (#511), so
  #     never put a trunk-only job (publish, deploy, release) behind this gate.
  # Any doubt — no run, red, an API error — runs the full suite; this job never fails the run.
  dedupe:
    name: Already tested at this sha or tree?
    # The trunk ref is `main`, and only `main`: project.yml `trunk:` (#493).
    if: github.event_name == 'push' && (github.event.created || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest # needs `gh`; GitHub-hosted images have it.
    timeout-minutes: 5 # one `gh api` listing, a hung call must not hold the slot.
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
      cited: ${{ steps.check.outputs.cited }}
    steps:
      - name: Look for a green run of this workflow at this sha or tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          CREATED: ${{ github.event.created }}
          REF_NAME: ${{ github.ref_name }}
          GUARD_NAME: Already tested at this sha or tree? # this job's `name:` — rename both together (#511).
        run: |
          tested=false
          cited=
          # #511: a cited run is reusable only if it skipped no job but this guard. A job gated on
          # the trunk ref is `skipped` on every branch push and a skipped job does not fail the
          # run, so citing that run would skip the trunk-only job on trunk a second time.
          reusable() {
            if ! SK="$(gh api "repos/$REPO/actions/runs/$1/jobs?per_page=100" \
                   --jq 'if .total_count > (.jobs | length) then "(more than 100 jobs)" else [.jobs[] | select(.conclusion == "skipped" and .name != env.GUARD_NAME) | .name] | join(", ") end' 2>/dev/null)"; then
              echo "::notice::Could not list the jobs of run $1 — running the full suite (#511)."
              return 1
            elif [ -n "$SK" ]; then
              echo "::notice::Run $1 skipped $SK, which this push may run — running the full suite (#511)."
              return 1
            fi
          }
          # The candidate runs, one per line as "<id> <head sha> <url> <branch>", newest first: green
          # push runs of this workflow on another ref of this repo. #552: those at THIS sha first (a
          # `ship-batch/*` run trunk fast-forwarded to), an exact query; then those whose commit has
          # THIS tree (#493). The query's own per_page bounds the walk (#592).
          same_sha() {
            gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$SHA&event=push&status=success&per_page=20" \
              --jq ".workflow_runs[] | select(.id != $RUN_ID and .head_branch != \"$REF_NAME\" and .head_repository.full_name == \"$REPO\") | \"\\(.id) \\(.head_sha) \\(.html_url) \\(.head_branch)\"" 2>/dev/null
          }
          same_tree() {
            gh api "repos/$REPO/actions/workflows/$WFID/runs?event=push&status=success&per_page=50" \
              --jq ".workflow_runs[] | select(.id != $RUN_ID and .head_branch != \"$REF_NAME\" and .head_repository.full_name == \"$REPO\" and .head_commit.tree_id == \"$OURS\") | \"\\(.id) \\(.head_sha) \\(.html_url) \\(.head_branch)\"" 2>/dev/null
          }
          # #592: cite the newest candidate on stdin that passes every check. One that fails a check
          # is passed over, not the end of the search: the newest green run can be a skip-chained one
          # (#511) while an older run at the same sha or tree ran every job. A run already tried (the
          # sha query's runs reappear in the tree listing) is not tried twice.
          cite() {
            local CID CSHA URL BR CTREE
            while read -r CID CSHA URL BR; do
              [ -n "$CID" ] || continue
              case " $TRIED " in *" $CID "*) continue ;; esac
              TRIED="$TRIED $CID"
              if ! CTREE="$(gh api "repos/$REPO/git/commits/$CSHA" --jq .tree.sha 2>/dev/null)" || [ "$CTREE" != "$OURS" ]; then
                echo "::notice::Could not confirm the tree of $CSHA — passing over run $CID (#493)."
              elif reusable "$CID"; then
                tested=true
                cited="$URL"
                echo "::notice title=tree-already-green::$URL tree=$OURS head=$CSHA branch=$BR"
                echo "Tree $OURS already passed this workflow at $CSHA on $BR ($URL) — skipping the suite (#493)."
                echo "Already tested: tree \`$OURS\` passed this workflow on \`$BR\` — [the run relied on]($URL); suite skipped (#493)." >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
            done
            return 1
          }
          if ! command -v gh >/dev/null 2>&1; then
            echo "::notice::gh is not installed on this runner — running the full suite (#418)."
          elif ! WFID="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id 2>/dev/null)" || [ -z "$WFID" ]; then
            echo "::notice::Could not read this run's workflow id — running the full suite (#418)."
          elif [ "${CREATED:-}" = "false" ]; then
            # A non-creating push: trunk tree mode (#493). Every branch below but one runs the suite.
            if ! DESC="$(gh api "repos/$REPO/contents/.github/project.yml?ref=$SHA" -H 'Accept: application/vnd.github.raw' 2>/dev/null)" || [ -z "$DESC" ]; then
              echo "::notice::Could not read .github/project.yml at $SHA — running the full suite (#493)."
            elif grep -Eq '^tree-reuse[[:space:]]*:' <<< "$DESC"; then
              echo "::notice::tree-reuse is declared in .github/project.yml — running the full suite (#493)."
            elif [ "$(printf '%s\n' "$DESC" | sed -nE "s/^trunk:[[:space:]]*[\"']?([A-Za-z0-9._/-]+).*/\\1/p" | head -n 1)" != "$REF_NAME" ]; then
              echo "::notice::$REF_NAME is not this repo's trunk — running the full suite (#493)."
            elif ! OURS="$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha 2>/dev/null)" || [ -z "$OURS" ]; then
              echo "::notice::Could not read the tree of $SHA — running the full suite (#493)."
            else
              TRIED=
              SC="$(same_sha)" || SC=    # the sha query failing falls through to the tree listing (#552)
              if [ -n "$SC" ] && cite <<< "$SC"; then
                :
              elif ! TC="$(same_tree)"; then
                echo "::notice::Could not list this workflow's green runs — running the full suite (#493)."
              elif [ -z "$SC$TC" ]; then
                echo "No green run of this workflow on another ref has sha $SHA or tree $OURS — running the full suite."
              elif ! cite <<< "$TC"; then
                echo "No green run of this workflow at sha $SHA or tree $OURS can be cited — running the full suite (#592)."
              fi
            fi
          elif ! N="$(gh api "repos/$REPO/actions/workflows/$WFID/runs?head_sha=$SHA&status=success&per_page=20" \
                 --jq "[.workflow_runs[] | select(.id != $RUN_ID and .event != \"pull_request\")] | length" 2>/dev/null)"; then
            echo "::notice::Could not list this workflow's runs at $SHA — running the full suite (#418)."
          elif [ "${N:-0}" -ge 1 ] 2>/dev/null; then
            tested=true
            echo "This workflow already passed at $SHA ($N green run(s)) — skipping the suite (#418)."
            echo "Already tested: this workflow has a green run at \`$SHA\` — suite skipped (#418)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No green run of this workflow at $SHA yet — running the full suite."
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          [ -z "$cited" ] || echo "cited=$cited" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Secret scan (gitleaks)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned binary)
        run: |
          # The pinned release binary is used instead of gitleaks-action v2,
          # which requires GITLEAKS_LICENSE for repositories owned by an
          # organization (personal repositories are free). The binary itself
          # is MIT and requires nothing.
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
      - name: gitleaks detect
        env:
          # Passed through env, never interpolated into the script below: on a
          # public repository a branch name is attacker-controlled input.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TRUNK: ${{ github.event.repository.default_branch }}
        run: |
          # A run answers for what triggered it, not for every ref that happens
          # to be on the remote. `fetch-depth: 0` fetches every branch, and a
          # bare `gitleaks detect` walks `git log --all` — so trunk's verdict
          # used to depend on whatever unmerged branches were pushed at that
          # moment, and a fixture on one of them turned trunk red on an
          # unrelated commit.
          #
          #   push to trunk       -> trunk's own history (everything HEAD reaches)
          #   anything else       -> only the commits this ref adds over trunk
          #                          (a pull request's own commits)
          #
          # Widening `on.push.branches` later needs no change here: a branch
          # push falls into the second case.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "$TRUNK" ]; then
            scope="HEAD"
          else
            scope="origin/${TRUNK}..HEAD"
          fi

          # Resolve the scope ourselves before handing it over. gitleaks does
          # NOT fail on a scope it cannot resolve: given a revision git rejects
          # it logs an error, scans 0 commits and exits 0 with "no leaks found"
          # (measured, 8.30.1). A scan that quietly looks at nothing is a green
          # gate over an unread tree, so the failure has to happen here.
          # See docs/gotchas.d/197-gitleaks-unresolvable-scope-exits-zero.md
          count="$(git rev-list --count "$scope")" || {
            echo "::error::cannot resolve the scan scope '${scope}' — refusing to scan nothing"
            exit 1
          }
          echo "gitleaks scope: git log ${scope} (${count} commits)"

          gitleaks detect --source . --no-banner --log-opts="$scope"

  go:
    name: Build, vet and test
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Tracks go.mod rather than pinning a duplicate version here, so
          # the toolchain floor is stated in exactly one place.
          go-version-file: go.mod

      # gofmt, build, vet, test -race — the same script a session runs locally
      # before it ships (#233). One file, not a hand-copied list of steps: a
      # local gate that reruns this list from memory is exactly how #230
      # reached trunk gofmt-dirty while build/vet/test all passed.
      - name: gate (scripts/gate.sh)
        run: ./scripts/gate.sh

  # The platform layer on Windows (#303, #306). The Linux job above already
  # cross-compiles and cross-vets for Windows on every push; this one RUNS the
  # packages that have a Windows implementation, because a Job Object that
  # compiles and does not contain its tree is the failure this exists to catch.
  # scripts/gate-windows.sh owns the allowlist, the SKIP summary and the
  # must-pass list, as scripts/gate.sh does for the Linux job; and
  # scripts/e2e-windows.ps1 then runs the installed service end to end (#307).
  windows:
    name: Windows platform layer
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: windows-latest
    steps:
      # Before checkout, so the tree is not rewritten to CRLF: a shell script
      # with CRLF endings does not run under bash.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gate (scripts/gate-windows.sh)
        shell: bash
        run: ./scripts/gate-windows.sh

      # The pieces together (#307): build the windows release, assemble and
      # install the npm packages, enrol a principal, run doctor, start the
      # service (through its scheduled task when the runner allows it, and the
      # output says which), then create / get / close a session and assert
      # nothing is left running. The script owns what it asserts; its Done-when
      # is in #307. The unit-level Windows behaviour is the gate above.
      - name: end to end (scripts/e2e-windows.ps1)
        shell: pwsh
        timeout-minutes: 25
        run: ./scripts/e2e-windows.ps1

  # `muster service` (#341) against a real service manager. The unit tests use a
  # fake one; this is the check that the unit it writes loads, starts, answers
  # /v1/health, survives a second install untouched, restarts on an upgrade and
  # unloads. The hosted Linux runner has systemd but no user session, so the step
  # starts the user manager the way a login would (linger), and points
  # `systemctl --user` at it.
  service-linux:
    name: muster service on systemd --user
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o "$RUNNER_TEMP/muster" ./cmd/muster
      - name: Start a user manager
        run: |
          sudo apt-get install -y tmux
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          uid="$(id -u)"
          for _ in $(seq 1 20); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 0.5
          done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: install, status, second install, upgrade, uninstall
        run: ./scripts/e2e-service.sh full "$RUNNER_TEMP/muster"
      # The release host's installer (#383) against the same real service manager: a clean install, an upgrade, a
      # repeat, and a refused checksum. After the step above, which ends with --purge.
      - name: install.sh, fresh and over an existing install
        run: ./scripts/e2e-installer.sh
      - name: The service's log, on failure
        if: failure()
        run: journalctl --user -u muster.service --no-pager -n 100 || true

  # The Linux sandbox mechanism (#439) against a REAL kernel, on its own job so a
  # failure names the mechanism. It needs Landlock ABI 6 (Linux 6.12). Measured on
  # 2026-11-11 the hosted image has kernel 7.0 and Landlock ABI 8, so the default
  # runner is the hosted one; the repository variable MUSTER_LINUX_SANDBOX_RUNNER
  # names another runner (an older image to prove the refusal on, or a self-hosted
  # machine) without a change to this file.
  #
  # MUSTER_SANDBOX_REQUIRE=1 turns every skip for a missing kernel feature into a
  # failure. The `go` job runs the same tests and skips them quietly on a kernel
  # without the feature; this job exists so that a hosted image that moves to such
  # a kernel makes THIS job red, with the kernel's facts in its log, instead of the
  # tests going grey where nobody looks.
  sandbox-linux:
    name: Linux sandbox (needs Landlock ABI 6)
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ vars.MUSTER_LINUX_SANDBOX_RUNNER || 'ubuntu-latest' }}
    env:
      MUSTER_SANDBOX_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: What this kernel offers
        run: |
          echo "uname -r: $(uname -r)"
          echo "active security modules: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unknown)"
          go test ./internal/sandbox -run TestHostFacts -count=1 -v
      - name: launcher, policy, filter, and a confined child doing each refused thing
        run: go test ./internal/sandbox -count=1 -v
      - name: the opencode driver starts its server under the mechanism, and is measured under it
        run: go test ./internal/drivers/opencode -run 'LinuxSandbox|LinuxPrivate|SandboxMeasured|StartServer' -count=1 -v
      - name: the multiplexer driver, on a real multiplexer
        run: |
          sudo apt-get install -y tmux
          FLEET_TMUX_INTEGRATION=1 go test ./internal/drivers/tmux -run 'LiveLinux|LinuxSandbox' -count=1 -v

  # The macOS half stops short of loading: a Background launchd job needs a login
  # session a hosted runner does not give. It does run the real install path as
  # far as the unit and lint what was written.
  service-macos:
    name: muster service plist
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o "$RUNNER_TEMP/muster" ./cmd/muster
      - name: install --no-start, lint the plist, second install, uninstall
        run: ./scripts/e2e-service.sh lint "$RUNNER_TEMP/muster"
      # The package-cache copy (#433) reaches clonefileat(2) by a literal system
      # call number, which nothing promises and which the Linux job cannot run.
      # macos-latest is arm64, the architecture a developer machine cannot prove;
      # these tests fail, not skip, when the host answers EINVAL or ENOSYS to it.
      - name: package-cache clone (clonefileat by number)
        run: go test ./internal/drivers/opencode -run 'CloneDirectory|CopyTree' -count=1 -v
