name: CI

# Triggers: a push to trunk, a push to a session branch, and pull requests.
#
# A session-branch push IS a trigger (#299). It reverses the first ruling of
# #199, which kept trunk and pull requests only. That ruling had three
# concerns, and each is answered:
#   - exposure: a branch push has already published the branch; a trigger adds
#     none. The gitleaks step scopes a branch push as origin/<trunk>..HEAD.
#   - a misleading class: a scan-only run reading `green` with no test behind
#     it. It cannot happen, because the WHOLE workflow runs on a branch, so the
#     `go` job (scripts/gate.sh, -race) runs too and `green` means tests ran.
#   - flakes: a -race flake on a branch now blocks that branch's ship. That is
#     the accepted cost of `gate.authoritative: ci` in project.yml: the full
#     suite runs here, on a hosted runner, and never on a developer machine.
# The globs are the branch types in CLAUDE.md plus `design/`.
#
# Reasoning, and the convention for key-shaped test fixtures:
# docs/internals.md, "Secret scanning, and fixtures that look like secrets".
on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "refactor/**"
      - "test/**"
      - "perf/**"
      - "design/**"
  pull_request:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned binary)
        run: |
          # The pinned release binary is used instead of gitleaks-action v2,
          # which requires GITLEAKS_LICENSE for repositories owned by an
          # organization (personal repositories are free). The binary itself
          # is MIT and requires nothing.
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
      - name: gitleaks detect
        env:
          # Passed through env, never interpolated into the script below: on a
          # public repository a branch name is attacker-controlled input.
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TRUNK: ${{ github.event.repository.default_branch }}
        run: |
          # A run answers for what triggered it, not for every ref that happens
          # to be on the remote. `fetch-depth: 0` fetches every branch, and a
          # bare `gitleaks detect` walks `git log --all` — so trunk's verdict
          # used to depend on whatever unmerged branches were pushed at that
          # moment, and a fixture on one of them turned trunk red on an
          # unrelated commit.
          #
          #   push to trunk       -> trunk's own history (everything HEAD reaches)
          #   anything else       -> only the commits this ref adds over trunk
          #                          (a pull request's own commits)
          #
          # Widening `on.push.branches` later needs no change here: a branch
          # push falls into the second case.
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "$TRUNK" ]; then
            scope="HEAD"
          else
            scope="origin/${TRUNK}..HEAD"
          fi

          # Resolve the scope ourselves before handing it over. gitleaks does
          # NOT fail on a scope it cannot resolve: given a revision git rejects
          # it logs an error, scans 0 commits and exits 0 with "no leaks found"
          # (measured, 8.30.1). A scan that quietly looks at nothing is a green
          # gate over an unread tree, so the failure has to happen here.
          # See docs/gotchas.d/197-gitleaks-unresolvable-scope-exits-zero.md
          count="$(git rev-list --count "$scope")" || {
            echo "::error::cannot resolve the scan scope '${scope}' — refusing to scan nothing"
            exit 1
          }
          echo "gitleaks scope: git log ${scope} (${count} commits)"

          gitleaks detect --source . --no-banner --log-opts="$scope"

  go:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Tracks go.mod rather than pinning a duplicate version here, so
          # the toolchain floor is stated in exactly one place.
          go-version-file: go.mod

      # gofmt, build, vet, test -race — the same script a session runs locally
      # before it ships (#233). One file, not a hand-copied list of steps: a
      # local gate that reruns this list from memory is exactly how #230
      # reached trunk gofmt-dirty while build/vet/test all passed.
      - name: gate (scripts/gate.sh)
        run: ./scripts/gate.sh
