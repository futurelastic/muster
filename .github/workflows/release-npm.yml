name: Release npm

# Publishes muster to public npm (#243) as a launcher plus one package per
# platform. npx is the one install surface: nothing is attached to a GitHub
# Release, and nothing is downloaded at install time.
#
#   @futurelastic/muster                  the launcher (`bin: muster`); carries no binary
#   @futurelastic/muster-darwin-arm64     one binary each; `os`/`cpu` make npm install
#   @futurelastic/muster-darwin-x64       only the one that matches the machine
#   @futurelastic/muster-linux-x64
#   @futurelastic/muster-linux-arm64
#   @futurelastic/muster-win32-x64        muster.exe; npm names follow process.platform
#   @futurelastic/muster-win32-arm64
#
# All seven carry the SAME version, the release tag without its "v". The
# launcher pins the platform packages to that exact version and refuses to run
# a mismatched one. Platform packages are published first, the launcher last.
#
# WINDOWS (#309). The two win32 packages are published like the rest, and are
# proved on Windows twice. BEFORE the publish, `verify-windows` runs each
# binary the tag built on the hardware it is for (windows-latest for amd64, an
# arm64 runner for arm64) and prints its version; `npm` needs it, so a Windows
# binary that does not start publishes nothing, not even the other six.
# AFTER the publish, `install-windows` installs the launcher from the registry
# with `npm i -g` on those two runners and runs `muster --version`, the one
# thing a user does. A tag cut before the Windows work (#316) has no windows
# binary: both jobs then skip their steps, assemble-npm.mjs leaves the packages
# out and the launcher does not list them, so such a tag still publishes.
# Neither job is allowed `continue-on-error`: release-auto.yml starts from a
# green CI, whose Windows job already gates every candidate, and a Windows check
# that may fail quietly is not a check.
#
# TWO ENTRY POINTS, ONE PIPELINE
#
#   workflow_call      the ONLY way anything is published. release-auto.yml
#                      calls this file, from the run that cuts or finalizes a
#                      tag, or — for a tag that already exists — from its
#                      `publish-tag` dispatch or its daily reconcile (#263).
#                      This is the reason this is a reusable workflow and not
#                      `on: push: tags` / `on: release`: a tag created with
#                      GITHUB_TOKEN does not trigger other workflows, so a
#                      listener would never fire for an automated release.
#   workflow_dispatch  DRY RUN ONLY: prove that a change to this file or to the
#                      packaging still builds and packs. `dry_run: false` is
#                      refused before anything is built — see below.
#
# TRUSTED PUBLISHING (OIDC) ONLY. No npm token is stored, read or accepted, and
# the job refuses to run if one is in its environment. npm matches the workflow
# that STARTS the run, and each package holds ONE trusted publisher. Setup on
# npmjs.com, for EACH of the seven packages: Settings -> Trusted publishing ->
# GitHub Actions, this repository, workflow file name = `release-auto.yml`.
# That setting is permanent. Do NOT switch it to `release-npm.yml` to publish
# something by hand — a dispatch here can no longer publish, and the way to
# publish an existing tag is Release (auto) -> Run workflow -> publish-tag (#263).
#
# GITHUB-HOSTED, ALWAYS. npm trusted publishing does not support self-hosted
# runners. The repo is public, so this costs nothing.
#
# IT NEVER MOVES GIT. It checks the tag out, stamps versions into the assembled
# copies under the runner's temp dir, and publishes. Nothing is committed,
# pushed or tagged. A version already on npm is skipped, so re-running a failed
# run finishes the publish instead of failing on the package that already went.
#
# DRY RUN. `dry_run: true` builds, assembles, runs the packaging tests and
# `npm publish --dry-run` on every package. It needs no npm identity and
# publishes nothing, so it is how a change to this file is proven.
on:
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.2.0)
        required: true
        type: string
      dry_run:
        description: Build and `npm publish --dry-run`; publish nothing
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.2.0)
        required: true
        type: string
      dry_run:
        description: Must stay true here. A real publish goes through Release (auto) -> publish-tag.
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  binaries:
    name: Cross-compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Passed through env, never interpolated into a script: an input is
      # caller-controlled text.
      TAG: ${{ inputs.tag }}
    outputs:
      # The windows architectures this tag's build produced ("amd64 arm64", or
      # empty for a tag whose source cannot build windows, #316). The two Windows
      # jobs read it; it is the one place that question is answered.
      windows: ${{ steps.windows.outputs.built }}
    steps:
      # A manual dispatch cannot authenticate to npm: the trusted publisher names
      # release-auto.yml. Say so now, before any build, instead of failing late
      # with ENEEDAUTH (#263). Only a run STARTED by this file is refused: inside a
      # workflow_call, github.event_name and github.workflow_ref are the CALLER's
      # (release-auto.yml dispatched with publish-tag is a `workflow_dispatch`
      # event too, and must not be mistaken for a manual dispatch of this file).
      - name: Refuse a manual publish
        if: github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/release-npm.yml@') && !inputs.dry_run
        run: |
          echo "::error::a manual dispatch of release-npm.yml can only dry-run: npm's trusted publisher is release-auto.yml, so this would fail to authenticate. To publish $TAG use Actions -> Release (auto) -> Run workflow -> publish-tag = $TAG (or: gh workflow run release-auto.yml -f publish-tag=$TAG)."
          exit 1

      - name: Check the tag shape
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a release tag (want vMAJOR.MINOR.PATCH[-prerelease])"; exit 1 ;;
          esac

      # The build script, from the ref that started this run.
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false

      # The source being released: the tag, with its history so `git describe`
      # can see the tag it is checked out at.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          path: src
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Build
        working-directory: src
        run: ../tooling/scripts/build-release.sh "$RUNNER_TEMP/dist" "$TAG"

      - name: Verify what was built
        working-directory: ${{ runner.temp }}/dist
        run: |
          sha256sum -c SHA256SUMS
          ./muster-"$TAG"-linux-amd64 --version | tee /dev/stderr | grep -qF "muster $TAG "

      - name: Which windows binaries were built
        id: windows
        working-directory: ${{ runner.temp }}/dist
        run: |
          set -eu
          built=""
          for arch in amd64 arm64; do
            if [ -f "muster-$TAG-windows-$arch.exe" ]; then built="$built $arch"; fi
          done
          built="${built# }"
          echo "built=$built" >> "$GITHUB_OUTPUT"
          if [ -n "$built" ]; then
            echo "windows binaries: $built"
          else
            echo "::notice::$TAG has no windows binary (its source predates the Windows work); the windows packages are not published for it"
          fi

      # Workflow artifacts, not release assets: the consumer is the npm job
      # below. The name carries the tag: one run can publish two tags (a
      # candidate and a final) and upload-artifact refuses a second artifact of
      # the same name in a run.
      - uses: actions/upload-artifact@v4
        with:
          name: muster-binaries-${{ inputs.tag }}
          path: ${{ runner.temp }}/dist/muster-*
          if-no-files-found: error
          retention-days: 7

  # Each windows binary the tag built, run once on the hardware it is for (#309).
  # The job always runs, and its steps skip for a tag without windows binaries:
  # a job skipped by `if:` would also skip `npm` (a skipped `needs` is not a
  # success), and a publish that silently does not happen is the worse failure.
  # The expected CPU is asserted, so a runner label that drifts to another
  # architecture cannot make an emulated run read as proof.
  verify-windows:
    name: Run the Windows build (${{ matrix.arch }})
    needs: binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions: {} # nothing here reads the repository or the API
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
            cpu: AMD64
          - arch: arm64
            runner: windows-11-arm
            cpu: ARM64
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ inputs.tag }}
      ARCH: ${{ matrix.arch }}
      BUILT: ${{ needs.binaries.outputs.windows }}
    steps:
      - name: Does this tag carry a windows-${{ matrix.arch }} build
        id: has
        run: |
          $present = (@($env:BUILT -split ' ') -contains $env:ARCH)
          "present=$($present.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $present) {
            Write-Host "::notice::$env:TAG has no windows-$env:ARCH binary; nothing to run"
          }

      - uses: actions/download-artifact@v4
        if: steps.has.outputs.present == 'true'
        with:
          name: muster-binaries-${{ inputs.tag }}
          path: ${{ runner.temp }}/dist

      - name: Run the binary and read its version
        if: steps.has.outputs.present == 'true'
        env:
          WANT_CPU: ${{ matrix.cpu }}
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne $env:WANT_CPU) {
            throw "this runner is $env:PROCESSOR_ARCHITECTURE, not $env:WANT_CPU: a $env:ARCH binary would not be proved on its own hardware"
          }
          $exe = Join-Path $env:RUNNER_TEMP "dist\muster-$env:TAG-windows-$env:ARCH.exe"
          $out = (& $exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "$exe --version exited $LASTEXITCODE`n$out" }
          Write-Host $out
          if (-not $out.StartsWith("muster $env:TAG ")) {
            throw "the binary says '$out', not 'muster $env:TAG ...': it is not the release it is published under"
          }
          "- windows-$env:ARCH ($env:PROCESSOR_ARCHITECTURE) runs: ``$out``" >> $env:GITHUB_STEP_SUMMARY

  npm:
    name: Publish to npm (trusted publishing)
    # verify-windows is required: it always succeeds or fails (never skipped),
    # so this job cannot be skipped by it. See the note above that job.
    needs: [binaries, verify-windows]
    runs-on: ubuntu-latest # NEVER self-hosted: npm trusted publishing does not support it.
    permissions:
      contents: read # read the repository's visibility
      id-token: write # the OIDC token npm exchanges for a one-time publish credential
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # The scripts come from the ref that started this run. Checking them out is
      # the only thing that runs before the guard below, and the repository is
      # public by the time anything reads it — a private one is refused next.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false # nothing here pushes

      - name: Refuse a private repository, and any npm token
        run: |
          set -uo pipefail
          # Visibility from the API, never assumed: anything but an explicit
          # `false` is refused like private. A transient error (a 5xx, a 429, a
          # dropped connection) is retried before it counts (#260, #261); the log
          # names which of "transient, retried N" / "private" / "persistent error"
          # it was. The policy lives in scripts/release-npm-guard.sh, where
          # release_workflow_test.go runs it against a fake `gh`.
          scripts/release-npm-guard.sh visibility || exit 1
          if [ -n "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}" ]; then
            echo "::error::an npm token is set in this job's environment — this workflow publishes through trusted publishing (OIDC) only and never with a token. Remove it."
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24 # no registry-url: that writes an .npmrc expecting a token

      - name: npm new enough for trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install --global npm@11
          fi
          npm --version

      - uses: actions/download-artifact@v4
        with:
          name: muster-binaries-${{ inputs.tag }}
          path: ${{ runner.temp }}/dist

      # The assembly script and the packaging tests come from the checkout at the
      # top of this job (the ref that started this run) — not the tag, so a tag
      # cut before they existed can be published.
      - name: Check the binaries, assemble the packages, test the packaging
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP"/dist/muster-*
          # The one check a downloader can make: the binary names the tag it is published under.
          "$RUNNER_TEMP/dist/muster-$TAG-linux-amd64" --version | grep -qF "muster $TAG "
          node scripts/assemble-npm.mjs "$RUNNER_TEMP/dist" "$TAG" "$RUNNER_TEMP/pkgs"
          node --test npm/test/npm.test.mjs

      - name: Publish (platform packages first, launcher last)
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-*) DIST=next ;;   # a release candidate never moves `latest`
            *)   DIST=latest ;;
          esac
          while read -r dir; do
            NAME="@futurelastic/$dir"
            if [ "$DRY_RUN" = "true" ]; then
              (cd "$RUNNER_TEMP/pkgs/$dir" && npm publish --dry-run --tag "$DIST" --access public --ignore-scripts)
              echo "DRY RUN: $NAME@$VERSION would be published (dist-tag $DIST)" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Skips a version already on npm, retries a transient registry error, and
            # counts a publish that lost a race to an earlier attempt as done (#261).
            scripts/release-npm-guard.sh publish "$NAME" "$VERSION" "$DIST" "$RUNNER_TEMP/pkgs/$dir" | tee -a "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/pkgs/PUBLISH_ORDER"

  # What a Windows user does, against what was just published (#309): install
  # the launcher from the registry and run it. It runs only after a real
  # publish (a dry run has nothing on the registry), and on the same two
  # runners as verify-windows.
  #
  # The registry's read path is eventually consistent: a version the publish
  # call has just returned for can go unserved for longer than five minutes
  # (#407: 30 ETARGET answers over 5 minutes on a publish that had worked). So
  # the step first WAITS, cheaply, with `npm view`, until the registry lists
  # both the launcher and this runner's win32 package at this version, then
  # installs once. The wait has a deadline (WAIT_MINUTES) and backs off between
  # reads; an install that still answers ETARGET or E404 (another edge not
  # caught up) waits inside the same deadline. Only "not listed yet" is waited
  # on. Any other npm answer, or a launcher that installs but whose
  # `muster --version` does not name the tag, fails at once. A package that is
  # genuinely missing never gets listed, so it fails when the deadline runs out
  # and the run is red; re-running it skips the packages that are already on npm
  # and checks again.
  install-windows:
    name: Install from npm on Windows (${{ matrix.arch }})
    needs: [binaries, npm]
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25 # the deadline below, plus one slow npm call, plus the setup
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
            cpu: x64
          - arch: arm64
            runner: windows-11-arm
            cpu: arm64
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ inputs.tag }}
      ARCH: ${{ matrix.arch }}
      BUILT: ${{ needs.binaries.outputs.windows }}
    steps:
      - name: Does this tag carry a windows-${{ matrix.arch }} package
        id: has
        run: |
          $present = (@($env:BUILT -split ' ') -contains $env:ARCH)
          "present=$($present.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $present) {
            Write-Host "::notice::$env:TAG has no windows-$env:ARCH package; nothing to install"
          }

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: steps.has.outputs.present == 'true'
        with:
          node-version: 24 # npm's launcher is Node; its architecture picks the platform package

      - name: npm i -g the published launcher, then muster --version
        if: steps.has.outputs.present == 'true'
        env:
          WANT_CPU: ${{ matrix.cpu }}
          # How long the registry gets to list this version, in minutes: the
          # slowest propagation seen was past 5 (#407), so this is three times that.
          WAIT_MINUTES: 15
        run: |
          # The launcher chooses its platform package by process.arch, so a Node
          # that is not the runner's own (an x64 build emulated on arm64) would
          # install, and prove, the wrong package.
          $nodeArch = (node -p 'process.arch').Trim()
          if ($nodeArch -ne $env:WANT_CPU) {
            throw "node here is $nodeArch, not $env:WANT_CPU: the win32-$env:WANT_CPU package would not be the one installed"
          }
          $version = $env:TAG.TrimStart('v')
          $spec = "@futurelastic/muster@$version"
          $platformSpec = "@futurelastic/muster-win32-$env:WANT_CPU@$version"
          $deadline = (Get-Date).AddMinutes([double]$env:WAIT_MINUTES)
          $backoff = @{ Seconds = 10 }

          # Run npm; hand back its exit code and everything it printed.
          function Invoke-Npm([string[]]$NpmArgs) {
            $ErrorActionPreference = 'Continue'
            $out = (& npm @NpmArgs 2>&1 | Out-String).Trim()
            [pscustomobject]@{ Code = $LASTEXITCODE; Out = $out }
          }

          # The one lag signature: the registry answers, but not with this
          # version yet (E404 from a view, ETARGET from an install). Anything
          # else npm says is not a wait.
          function Test-NotListedYet([string]$text) { $text -match '\bcode (ETARGET|E404)\b' }

          # Sleep before the next read, backing off to a minute; the budget message is
          # the old one, so a publish that is really broken reads the same as before.
          function Wait-ForTheRegistry([string]$why) {
            $left = ($deadline - (Get-Date)).TotalSeconds
            if ($left -le 0) {
              throw "$spec did not install and run on windows-$env:ARCH within the retry budget"
            }
            $nap = [int][Math]::Min($backoff.Seconds, [Math]::Ceiling($left))
            Write-Host "$why; the registry may not serve this version everywhere yet; waiting ${nap}s ($([int]$left)s of the budget left)"
            Start-Sleep -Seconds $nap
            $backoff.Seconds = [Math]::Min([int]($backoff.Seconds * 1.5), 60)
          }

          # Poll the cheap read until the registry lists this exact version.
          function Wait-Listed([string]$what) {
            while ($true) {
              $r = Invoke-Npm @('view', '--prefer-online', $what, 'version')
              if ($r.Code -eq 0 -and $r.Out -eq $version) { Write-Host "$what is listed"; return }
              if ($r.Code -eq 0 -and $r.Out -eq '') { Wait-ForTheRegistry "npm view of $what listed nothing"; continue }
              if ($r.Code -ne 0 -and (Test-NotListedYet $r.Out)) { Wait-ForTheRegistry "$what is not listed yet"; continue }
              Write-Host $r.Out
              throw "npm view $what on windows-$env:ARCH answered exit $($r.Code), which is neither a listing nor the registry lagging"
            }
          }

          Wait-Listed $spec
          Wait-Listed $platformSpec

          while ($true) {
            Write-Host "== npm i -g $spec"
            $r = Invoke-Npm @('install', '-g', '--prefer-online', '--no-audit', '--no-fund', $spec)
            Write-Host $r.Out
            if ($r.Code -eq 0) { break }
            if (-not (Test-NotListedYet $r.Out)) {
              throw "npm install -g $spec failed on windows-$env:ARCH with exit $($r.Code), which is not the registry lagging"
            }
            Wait-ForTheRegistry "the install did not find $spec"
          }

          $prefix = (npm prefix -g).Trim()
          $env:PATH = "$prefix;$env:PATH"
          $got = (& muster --version 2>&1 | Out-String).Trim()
          $code = $LASTEXITCODE
          Write-Host $got
          if ($code -ne 0 -or -not $got.StartsWith("muster $env:TAG ")) {
            npm ls -g --all
            throw "$spec installed on windows-$env:ARCH but 'muster --version' did not name $env:TAG (exit $code)"
          }
          "- ``npm i -g $spec`` on windows-$env:ARCH ($nodeArch): ``$got``" >> $env:GITHUB_STEP_SUMMARY
