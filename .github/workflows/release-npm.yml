name: Release npm

# Publishes muster to public npm (#243) as a launcher plus one package per
# platform. npx is the one install surface: nothing is attached to a GitHub
# Release, and nothing is downloaded at install time.
#
#   @futurelastic/muster                  the launcher (`bin: muster`); carries no binary
#   @futurelastic/muster-darwin-arm64     one binary each; `os`/`cpu` make npm install
#   @futurelastic/muster-darwin-x64       only the one that matches the machine
#   @futurelastic/muster-linux-x64
#   @futurelastic/muster-linux-arm64
#
# All five carry the SAME version, the release tag without its "v". The
# launcher pins the platform packages to that exact version and refuses to run
# a mismatched one. Platform packages are published first, the launcher last.
#
# TWO ENTRY POINTS, ONE PIPELINE
#
#   workflow_call      the ONLY way anything is published. release-auto.yml
#                      calls this file, from the run that cuts or finalizes a
#                      tag, or — for a tag that already exists — from its
#                      `publish-tag` dispatch or its daily reconcile (#263).
#                      This is the reason this is a reusable workflow and not
#                      `on: push: tags` / `on: release`: a tag created with
#                      GITHUB_TOKEN does not trigger other workflows, so a
#                      listener would never fire for an automated release.
#   workflow_dispatch  DRY RUN ONLY: prove that a change to this file or to the
#                      packaging still builds and packs. `dry_run: false` is
#                      refused before anything is built — see below.
#
# TRUSTED PUBLISHING (OIDC) ONLY. No npm token is stored, read or accepted, and
# the job refuses to run if one is in its environment. npm matches the workflow
# that STARTS the run, and each package holds ONE trusted publisher. Setup on
# npmjs.com, for EACH of the five packages: Settings -> Trusted publishing ->
# GitHub Actions, this repository, workflow file name = `release-auto.yml`.
# That setting is permanent. Do NOT switch it to `release-npm.yml` to publish
# something by hand — a dispatch here can no longer publish, and the way to
# publish an existing tag is Release (auto) -> Run workflow -> publish-tag (#263).
#
# GITHUB-HOSTED, ALWAYS. npm trusted publishing does not support self-hosted
# runners. The repo is public, so this costs nothing.
#
# IT NEVER MOVES GIT. It checks the tag out, stamps versions into the assembled
# copies under the runner's temp dir, and publishes. Nothing is committed,
# pushed or tagged. A version already on npm is skipped, so re-running a failed
# run finishes the publish instead of failing on the package that already went.
#
# DRY RUN. `dry_run: true` builds, assembles, runs the packaging tests and
# `npm publish --dry-run` on every package. It needs no npm identity and
# publishes nothing, so it is how a change to this file is proven.
on:
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.2.0)
        required: true
        type: string
      dry_run:
        description: Build and `npm publish --dry-run`; publish nothing
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.2.0)
        required: true
        type: string
      dry_run:
        description: Must stay true here. A real publish goes through Release (auto) -> publish-tag.
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  binaries:
    name: Cross-compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Passed through env, never interpolated into a script: an input is
      # caller-controlled text.
      TAG: ${{ inputs.tag }}
    steps:
      # A manual dispatch cannot authenticate to npm: the trusted publisher names
      # release-auto.yml. Say so now, before any build, instead of failing late
      # with ENEEDAUTH (#263). Only a run STARTED by this file is refused: inside a
      # workflow_call, github.event_name and github.workflow_ref are the CALLER's
      # (release-auto.yml dispatched with publish-tag is a `workflow_dispatch`
      # event too, and must not be mistaken for a manual dispatch of this file).
      - name: Refuse a manual publish
        if: github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/release-npm.yml@') && !inputs.dry_run
        run: |
          echo "::error::a manual dispatch of release-npm.yml can only dry-run: npm's trusted publisher is release-auto.yml, so this would fail to authenticate. To publish $TAG use Actions -> Release (auto) -> Run workflow -> publish-tag = $TAG (or: gh workflow run release-auto.yml -f publish-tag=$TAG)."
          exit 1

      - name: Check the tag shape
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a release tag (want vMAJOR.MINOR.PATCH[-prerelease])"; exit 1 ;;
          esac

      # The build script, from the ref that started this run.
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false

      # The source being released: the tag, with its history so `git describe`
      # can see the tag it is checked out at.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          path: src
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Build
        working-directory: src
        run: ../tooling/scripts/build-release.sh "$RUNNER_TEMP/dist" "$TAG"

      - name: Verify what was built
        working-directory: ${{ runner.temp }}/dist
        run: |
          sha256sum -c SHA256SUMS
          ./muster-"$TAG"-linux-amd64 --version | tee /dev/stderr | grep -qF "muster $TAG "

      # Workflow artifacts, not release assets: the only consumer is the npm
      # job below.
      - uses: actions/upload-artifact@v4
        with:
          name: muster-binaries
          path: ${{ runner.temp }}/dist/muster-*
          if-no-files-found: error
          retention-days: 7

  npm:
    name: Publish to npm (trusted publishing)
    needs: binaries
    runs-on: ubuntu-latest # NEVER self-hosted: npm trusted publishing does not support it.
    permissions:
      contents: read # read the repository's visibility
      id-token: write # the OIDC token npm exchanges for a one-time publish credential
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # The scripts come from the ref that started this run. Checking them out is
      # the only thing that runs before the guard below, and the repository is
      # public by the time anything reads it — a private one is refused next.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false # nothing here pushes

      - name: Refuse a private repository, and any npm token
        run: |
          set -uo pipefail
          # Visibility from the API, never assumed: anything but an explicit
          # `false` is refused like private. A transient error (a 5xx, a 429, a
          # dropped connection) is retried before it counts (#260, #261); the log
          # names which of "transient, retried N" / "private" / "persistent error"
          # it was. The policy lives in scripts/release-npm-guard.sh, where
          # release_workflow_test.go runs it against a fake `gh`.
          scripts/release-npm-guard.sh visibility || exit 1
          if [ -n "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}" ]; then
            echo "::error::an npm token is set in this job's environment — this workflow publishes through trusted publishing (OIDC) only and never with a token. Remove it."
            exit 1
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24 # no registry-url: that writes an .npmrc expecting a token

      - name: npm new enough for trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install --global npm@11
          fi
          npm --version

      - uses: actions/download-artifact@v4
        with:
          name: muster-binaries
          path: ${{ runner.temp }}/dist

      # The assembly script and the packaging tests come from the checkout at the
      # top of this job (the ref that started this run) — not the tag, so a tag
      # cut before they existed can be published.
      - name: Check the binaries, assemble the packages, test the packaging
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP"/dist/muster-*
          # The one check a downloader can make: the binary names the tag it is published under.
          "$RUNNER_TEMP/dist/muster-$TAG-linux-amd64" --version | grep -qF "muster $TAG "
          node scripts/assemble-npm.mjs "$RUNNER_TEMP/dist" "$TAG" "$RUNNER_TEMP/pkgs"
          node --test npm/test/npm.test.mjs

      - name: Publish (platform packages first, launcher last)
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-*) DIST=next ;;   # a release candidate never moves `latest`
            *)   DIST=latest ;;
          esac
          while read -r dir; do
            NAME="@futurelastic/$dir"
            if [ "$DRY_RUN" = "true" ]; then
              (cd "$RUNNER_TEMP/pkgs/$dir" && npm publish --dry-run --tag "$DIST" --access public --ignore-scripts)
              echo "DRY RUN: $NAME@$VERSION would be published (dist-tag $DIST)" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Skips a version already on npm, retries a transient registry error, and
            # counts a publish that lost a race to an earlier attempt as done (#261).
            scripts/release-npm-guard.sh publish "$NAME" "$VERSION" "$DIST" "$RUNNER_TEMP/pkgs/$dir" | tee -a "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/pkgs/PUBLISH_ORDER"
